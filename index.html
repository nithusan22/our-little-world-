<!doctype html><html lang="ta"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>நம் காதல் உலகம் ❤️</title><style>
:root{font-family:"Noto Sans Tamil","Latha",system-ui,sans-serif;color:#4c244d;background:#160b24}*{box-sizing:border-box}body{margin:0}.app{max-width:460px;margin:auto;min-height:100dvh;background:radial-gradient(ellipse at 10% 0%,#ffe2f0,transparent 55%),linear-gradient(165deg,#fff7fc,#f5e7ff 65%,#fff0f7);padding:20px 18px 90px}.top{display:flex;justify-content:space-between;align-items:center}.eyebrow{font-size:12px;color:#9e729d}.title{font-size:25px;font-weight:800;margin:4px 0}.heart{font-size:26px}.hero{background:linear-gradient(135deg,#f26caa 0%,#c65cbd 48%,#7750bc 100%);border-radius:30px;color:white;padding:32px 20px;text-align:center;margin:18px 0;box-shadow:0 18px 38px #a65db850}.hero h2{margin:6px;font-size:25px}.hero p{margin:8px;color:#fff0fa}.pill{background:#ffffff35;padding:8px 12px;border-radius:25px;display:inline-block;font-size:13px}.card{background:#fff;border-radius:23px;padding:19px;margin:13px 0;box-shadow:0 9px 25px #b985b522;border:1px solid #fff9}.card h3{margin:0 0 10px}.btn{border:0;border-radius:17px;padding:13px 17px;background:linear-gradient(100deg,#e85a9e,#a268d4);color:white;font-weight:750;cursor:pointer}.btn.secondary{background:#f7e7f8;color:#8b418e}.btn:active{transform:scale(.97)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tile{border:0;border-radius:21px;background:linear-gradient(155deg,#fff,#fff4fb);padding:20px 10px;text-align:center;color:#663267;font-weight:700;box-shadow:0 4px 12px #b985b51c;cursor:pointer}.tile span{display:block;font-size:27px;margin-bottom:8px}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:460px;width:100%;display:flex;justify-content:space-around;background:#fff;box-shadow:0 -3px 20px #9e729d22;padding:10px 4px max(10px,env(safe-area-inset-bottom));z-index:2}.nav button{border:0;background:none;color:#987999;font-size:10px;cursor:pointer}.nav button b{display:block;font-size:22px}.nav button.active{color:#d74b9a}.field{width:100%;border:1px solid #e8d4e8;border-radius:12px;padding:12px;margin:7px 0 11px;font:inherit;background:#fff}.muted{color:#947c95;font-size:13px}.item{padding:13px 0;border-bottom:1px solid #f2e5f2}.item:last-child{border:0}.row{display:flex;align-items:center;justify-content:space-between;gap:8px}.emoji{font-size:32px}.moods{display:flex;gap:7px;justify-content:space-between}.moods button{border:2px solid transparent;border-radius:15px;background:#faeef8;padding:10px 6px;flex:1;font-size:22px;cursor:pointer}.moods button.selected{border-color:#da68ab;background:#fbd9ef}.moods small{display:block;font-size:10px;color:#704270}.tabs{display:flex;gap:7px;overflow:auto}.tabs button{border:0;background:#f3e2f3;padding:9px 13px;border-radius:12px;white-space:nowrap;color:#704270}.tabs .selected{background:#d95c9e;color:#fff}.hidden{display:none}.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#5b2e62;color:white;padding:12px 18px;border-radius:15px;z-index:4;max-width:90%;text-align:center}.spark{animation:pop .7s ease}@keyframes pop{50%{transform:scale(1.2)}}.photo{width:100%;height:120px;object-fit:cover;border-radius:12px;margin-top:8px}.tiny{font-size:11px;color:#947c95}label{font-size:13px;font-weight:700}.progress{height:8px;background:#f4e3f1;border-radius:8px;overflow:hidden}.progress div{height:100%;background:#dd5ca3}.empty{text-align:center;padding:24px;color:#a17d9d}

/* மென்மையான காதல் வடிவமைப்பு */
body:before{content:"♡  ✦  ♡  ✧  ♡";position:fixed;top:9px;left:0;width:100%;text-align:center;letter-spacing:35px;color:#ffb9d9;opacity:.23;pointer-events:none;animation:float 8s ease-in-out infinite}@keyframes float{50%{transform:translateY(24px)}}
.hero{position:relative;overflow:hidden}.hero:before{content:"♡";position:absolute;font-size:130px;top:-40px;right:-18px;opacity:.12;transform:rotate(-18deg)}.hero:after{content:"✧";position:absolute;font-size:90px;bottom:-35px;left:-10px;opacity:.13}
.title{font-size:23px;letter-spacing:-.3px}.eyebrow{font-size:11px}.hero h2{font-size:24px;line-height:1.6}.hero p{line-height:1.8}.card h3{line-height:1.6;font-size:17px}.card p,.muted,.item{line-height:1.8}.tile{line-height:1.5}.btn{font-family:inherit;box-shadow:0 5px 13px #cb65b030}.nav{border-radius:22px 22px 0 0}.nav button{font-family:inherit;font-size:9px;line-height:1.5}.field{font-family:inherit}.moods{flex-wrap:wrap}.moods button{min-width:53px}.moods small{font-family:inherit;font-size:9px}.toast{font-size:13px;line-height:1.6}.app{padding-top:27px}

.game-tag{display:inline-block;background:#fce0f1;color:#943b83;border-radius:100px;padding:5px 12px;font-size:11px;font-weight:700;letter-spacing:.3px}.game-panel{background:linear-gradient(140deg,#fffafd,#f5e6ff);border:1px solid #f1cce9;border-radius:22px;padding:18px;margin:13px 0;box-shadow:0 10px 25px #ab6f9a12}.game-panel h3{margin:9px 0}.game-action{display:block;width:100%;margin:10px 0;white-space:normal}.draw-wrap{background:white;border:2px solid #e6a8d7;border-radius:20px;overflow:hidden;touch-action:none}.draw-wrap canvas{display:block;width:100%;height:300px;touch-action:none}.color-pick{display:flex;gap:9px;justify-content:center;margin:12px 0}.color-pick button{width:34px;height:34px;border-radius:50%;border:3px solid white;box-shadow:0 0 0 1px #d6b4d0}.color-pick button.active{box-shadow:0 0 0 3px #933f94}.score-box{font-size:25px;font-weight:800;text-align:center;color:#a13c8e;padding:14px}.mini-note{font-size:12px;color:#926b91;line-height:1.7}

/* v6 romantic polish */
:root{--rose:#ed5a9e;--violet:#8751c6} .app{background:radial-gradient(circle at 85% 8%,#f6d8ff 0,transparent 34%),linear-gradient(165deg,#fff8fc,#f7edff 72%,#fff1f8)} .card,.v6card{box-shadow:0 12px 30px #9f57911b;border:1px solid #f9e6f5} .v6card{background:#fff;border-radius:24px;padding:18px;margin:14px 0} .v6card h3{margin:5px 0 9px}.v6lead{font-size:13px;color:#957b99;line-height:1.7}.v6grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.v6tile{background:linear-gradient(145deg,#fff,#fcecf8);border:1px solid #f6d8eb;border-radius:21px;padding:18px 9px;color:#713875;text-align:center;font:700 13px inherit;cursor:pointer;min-height:112px}.v6tile strong{display:block;font-size:28px;margin-bottom:9px}.v6hero{background:linear-gradient(135deg,#ee76b2,#b569d5 60%,#7d59bd);color:white;padding:25px 20px;border-radius:28px;text-align:center;margin:15px 0;box-shadow:0 14px 30px #b46cb850}.v6hero h2{margin:5px 0}.v6hero p{color:#fff2fa}.v6back{background:transparent;border:0;color:#974d99;font-weight:800;padding:12px 0;cursor:pointer}.v6big{font-size:75px;display:block;text-align:center;filter:drop-shadow(0 8px 12px #e59bc6)}.v6btn{display:block;width:100%;margin:9px 0}.v6chip{display:inline-block;border-radius:20px;background:#f9e6f5;padding:7px 12px;margin:3px;color:#90418d;font-size:12px}.v6photo{width:100%;max-height:280px;object-fit:cover;border-radius:18px}.v6canvas{width:100%;aspect-ratio:1;touch-action:none;border-radius:17px;background:#fff5fb;border:2px solid #f4d6ee}.v6row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.v6row>*{flex:1}.v6heart{animation:v6beat 1.7s infinite}@keyframes v6beat{0%,100%{transform:scale(1)}35%{transform:scale(1.13)}60%{transform:scale(1)}}.v6stars{background:radial-gradient(circle at 20% 25%,#fff 1px,transparent 2px),radial-gradient(circle at 70% 55%,#fff 1px,transparent 2px),radial-gradient(circle at 50% 10%,#fff 1px,transparent 2px),linear-gradient(160deg,#231848,#6b3b90);background-size:90px 90px,130px 130px,170px 170px,auto;border-radius:24px;color:#fff;text-align:center;padding:35px 15px}.v6stars textarea{background:#ffffffea}.v6tiny{font-size:11px;color:#9a809c}.v6btn:disabled{opacity:.45}.v6tag{font-size:12px;color:#a15b96}.v6locked{filter:blur(5px);user-select:none}.v6options button{width:100%;margin:6px 0}.nav{overflow-x:auto;justify-content:space-between;gap:5px}.nav button{min-width:48px;flex:1}
</style></head><body><main class="app"><header class="top"><div><div class="eyebrow">தூரம் இருந்தாலும் இதயங்கள் ஒன்றே ✨</div><div class="title" id="heading">நம் காதல் உலகம்</div></div><div class="heart">💗</div></header><section id="screen"></section></main><nav class="nav" id="nav"></nav><div id="toast" class="toast hidden"></div><script>
const $=s=>document.querySelector(s);const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const initial={person:'Nithu',partner:'Thenu',mood:'',partnerMood:'',hugs:0,letters:[],memories:[],answers:[],anniversary:'',reunion:'',notes:[]};let data;try{data={...initial,...JSON.parse(localStorage.getItem('olw-v1')||'{}')}}catch{data={...initial}}let page='Home',letterType='என் நினைவு வரும்போது திற',question=0,quizAnswer=null;const save=()=>localStorage.setItem('olw-v1',JSON.stringify(data));const notify=t=>{let el=$('#toast');el.textContent=t;el.classList.remove('hidden');setTimeout(()=>el.classList.add('hidden'),2300)};const tabs=['Home','Hugs','Moods','Letters','Memories','Games','Settings'];const tamilTabs=['முகப்பு','அணைப்பு','உணர்வு','கடிதம்','நினைவுகள்','விளையாட்டு','அமைப்புகள்'];const icons=['🏠','💞','🌈','💌','📸','🎲','⚙️'];const btn=(label,fn,secondary=false)=>`<button class="btn ${secondary?'secondary':''}" onclick="${fn}">${label}</button>`;function go(p){page=p;render();window.scrollTo(0,0)}function நாட்கள்Until(date){if(!date)return null;let a=new Date(date+'T12:00:00'),b=new Date();return Math.max(0,Math.ceil((a-b)/86400000))}function time(zone){return new Intl.DateTimeFormat('en-GB',{timeZone:zone,hour:'2-digit',minute:'2-digit'}).format(new Date())}function home(){return `<div class="hero"><div style="font-size:35px">💑</div><h2>${safe(data.person)} ♡ ${safe(data.partner)}</h2><p>இரு இதயங்கள்... ஒரே அழகான உலகம்.</p><div class="pill">🇬🇧 ${time('Europe/London')} &nbsp; • &nbsp; 🇱🇰 ${time('Asia/Colombo')}</div><p style="font-size:13px">எத்தனை தூரம் சென்றாலும் என் இதயம் உன்னிடமே 💕</p></div><div class="grid"><div class="card" style="margin:0;text-align:center"><div class="emoji">🗓️</div><b>${நாட்கள்Until(data.reunion)===null?'இன்னும் குறிப்பிடவில்லை':நாட்கள்Until(data.reunion)+' நாட்கள்'}</b><div class="muted">மீண்டும் சந்திக்க</div></div><div class="card" style="margin:0;text-align:center"><div class="emoji">💞</div><b>${data.hugs}</b><div class="muted">அனுப்பிய அணைப்புகள்</div></div></div><div class="card"><h3>இன்று உன் மனம் எப்படி இருக்கிறது?</h3><p class="muted">${data.mood?'இன்றைய உன் உணர்வு: '+safe(data.mood)+' 💗':'உன் மனதில் இருப்பதை உன் காதலிடம் பகிர்ந்துகொள்.'}</p>${btn('என் உணர்வைப் பகிர்',"go('Moods')")}</div><h3>நம் சின்னச் சின்ன சந்தோஷங்கள்</h3><div class="grid">${[['💞','அன்பு அணைப்பு','Hugs'],['💌','காதல் கடிதம்','Letters'],['📸','நினைவைச் சேமி','Memories'],['🎲','சேர்ந்து விளையாடு','Games']].map(([i,t,p])=>`<button class="tile" onclick="go('${p}')"><span>${i}</span>${t}</button>`).join('')}</div>`}function hugs(){return `<div class="hero"><div class="emoji spark" id="hugheart" style="font-size:70px">💗</div><h2>இதயத்திலிருந்து ஓர் அணைப்பு</h2><p>தூரத்தில் இருந்தாலும் உன் அன்பை உணர முடியும்.</p><div class="pill">${data.hugs} அணைப்புகள் அனுப்பப்பட்டன</div></div><div class="card" style="text-align:center"><h3>ஓர் அணைப்பு — ${safe(data.partner)}</h3><p class="muted">உன் அன்பை அனுப்ப இதயத்தைத் தொடு. ஆதரவு இருந்தால் கைபேசி அதிரும்.</p>${btn('💞 இறுக்கமாக அணைத்துக்கொள்','sendHug()')}<p class="tiny">மாதிரி செயலி: இந்தக் கைபேசியில் மட்டுமே பதிவாகும்.</p></div><div class="card"><h3>அன்புடன் அனுப்ப சில வரிகள்</h3>${['இப்போதே உன்னை இறுக்கமாக அணைக்க ஆசை 🥺','என் உலகத்தின் அழகான மனிதர் நீதான் ❤️','உன்னைப் பார்க்க இன்னும் ஒரு நாள் குறைந்துவிட்டது 🌷'].map(t=>`<div class="item row"><span>${safe(t)}</span><button class="btn secondary" onclick="shareText(${JSON.stringify(t).replace(/"/g,'&quot;')})">பகிர்</button></div>`).join('')}</div>`}function sendHug(){data.hugs++;save();if(navigator.vibrate)navigator.vibrate([120,70,120,70,240]);$('#hugheart')?.classList.remove('spark');setTimeout(()=>$('#hugheart')?.classList.add('spark'),30);notify('உன் அன்பு அணைப்பு இங்கே பதிவானது 💞');render()}function shareText(t){if(navigator.share)navigator.share({text:t}).catch(()=>{});else if(navigator.clipboard)navigator.clipboard.writeText(t).then(()=>notify('நகலெடுக்கப்பட்டது — உன் காதலுக்கு அனுப்பு 💌'));else notify('இந்தச் செய்தியை நகலெடுத்துப் பகிரவும்')}
const moods=[['🥰','காதல் நிறைந்தது'],['😊','மகிழ்ச்சி'],['🥺','உன் நினைவு'],['😔','சோகம்'],['😴','தூக்கம்']];function moodsPage(){return `<div class="card"><h3>உன் மனநிலை எப்படி?</h3><p class="muted">இன்றைய உணர்வைத் தேர்ந்தெடு.</p><div class="moods">${moods.map(([e,m])=>`<button class="${data.mood===m?'selected':''}" onclick="setMood('${m}')">${e}<small>${m}</small></button>`).join('')}</div></div><div class="card"><h3>இன்றைய மனநிலை</h3><div class="item">💗 ${safe(data.person)}: <b>${safe(data.mood||'இன்னும் தெரிவிக்கவில்லை')}</b></div><div class="item">💜 ${safe(data.partner)}: <b>${safe(data.partnerMood||'பதிவுக்காகக் காத்திருக்கிறது')}</b></div><p class="tiny">இரு கைபேசிகளிலும் ஒரே நேரத்தில் காண இணைய ஒத்திசைவு தேவை. இப்போது மாதிரியாகப் பதிவு செய்யலாம்.</p><label>துணையின் மனநிலை (மாதிரி)</label><select id="partnerMood" class="field"><option value="">உணர்வைத் தேர்வு செய்</option>${moods.map(([,m])=>`<option ${data.partnerMood===m?'selected':''}>${m}</option>`).join('')}</select>${btn('மாதிரி மனநிலையைச் சேமி','savePartnerMood()',true)}</div>`}function setMood(m){data.mood=m;save();notify('உன் உணர்வு சேமிக்கப்பட்டது 💗');render()}function savePartnerMood(){data.partnerMood=$('#partnerMood').value;save();render()}
const letterTypes=['என் நினைவு வரும்போது திற','சோகமாக இருக்கும்போது திற','தூக்கம் வராதபோது திற','சிரிக்கத் தோன்றும்போது திற','சும்மா உனக்காக'];function letters(){return `<div class="card"><h3>💌 இதயம் பேசும் கடிதங்கள்</h3><p class="muted">தூரத்தைத் தாண்டி உன்னை அணைக்கும் என் வார்த்தைகள்.</p><label>எப்போது திறக்க வேண்டும்?</label><select class="field" id="letterType">${letterTypes.map(t=>`<option ${letterType===t?'selected':''}>${t}</option>`).join('')}</select><label>உன் காதல் வார்த்தைகள்</label><textarea id="letterBody" class="field" rows="5" placeholder="என் உயிரே, உனக்கு என் நினைவு வரும்போதெல்லாம்..."></textarea>${btn('கடிதத்தைச் சேமி','addLetter()')}</div><h3>நம் கடிதங்கள் (${data.letters.length})</h3>${data.letters.length?data.letters.slice().reverse().map((l,i)=>`<div class="card"><div class="row"><b>💌 ${safe(l.type)}</b><span class="tiny">${safe(l.date)}</span></div><p style="white-space:pre-wrap">${safe(l.body)}</p>${btn('பகிர்',`shareLetter(${data.letters.length-1-i})`,true)}</div>`).join(''):'<div class="empty">முதல் காதல் கடிதத்திற்காக இந்த இடம் காத்திருக்கிறது 💕</div>'}`}function addLetter(){let body=$('#letterBody').value.trim();if(!body)return notify('முதலில் உன் காதல் வார்த்தைகளை எழுது');data.letters.push({type:$('#letterType').value,body,date:new Date().toLocaleதேதிString('en-GB')});save();notify('காதல் கடிதம் சேமிக்கப்பட்டது 💌');render()}function shareLetter(i){shareText(data.letters[i].type+'\n\n'+data.letters[i].body)}

eObjectURL(url);resolve(c.toDataURL('image/jpeg',.65))};img.onerror=reject;img.src=url})}

let drawStrokes=[],currentStroke=null;
function initDrawing(){drawCanvas=document.getElementById('loveCanvas');if(!drawCanvas)return;drawCtx=drawCanvas.getContext('2d');paintDrawing();drawCanvas.onpointerdown=e=>{e.preventDefault();drawCanvas.setPointerCapture(e.pointerId);drawDown=true;let r=drawCanvas.getBoundingClientRect(),pt={x:(e.clientX-r.left)*drawCanvas.width/r.width,y:(e.clientY-r.top)*drawCanvas.height/r.height};currentStroke={color:drawColor,points:[pt]};drawStrokes.push(currentStroke);paintDrawing()};drawCanvas.onpointermove=e=>{if(!drawDown||!currentStroke)return;e.preventDefault();let r=drawCanvas.getBoundingClientRect();currentStroke.points.push({x:(e.clientX-r.left)*drawCanvas.width/r.width,y:(e.clientY-r.top)*drawCanvas.height/r.height});paintDrawing()};drawCanvas.onpointerup=drawCanvas.onpointercancel=()=>{drawDown=false;currentStroke=null}}
function paintDrawing(){if(!drawCtx)return;let c=drawCanvas;drawCtx.fillStyle='#fffafc';drawCtx.fillRect(0,0,c.width,c.height);drawCtx.lineCap='round';drawCtx.lineJoin='round';for(let st of drawStrokes){drawCtx.strokeStyle=st.color;drawCtx.lineWidth=st.color==='#ffffff'?30:7;drawCtx.beginPath();st.points.forEach((p,i)=>i?drawCtx.lineTo(p.x,p.y):drawCtx.moveTo(p.x,p.y));if(st.points.length===1){let p=st.points[0];drawCtx.lineTo(p.x+.1,p.y+.1)}drawCtx.stroke()}}
function setDrawColor(c){drawColor=c;document.querySelectorAll('.color-pick button').forEach(b=>b.classList.toggle('active',b.style.backgroundColor===hexToRgb(c)));}function hexToRgb(h){let x=parseInt(h.slice(1),16);return `rgb(${x>>16}, ${(x>>8)&255}, ${x&255})`}
function undoDrawing(){drawStrokes.pop();paintDrawing()}

case 'puzzle':inner=`<div class="v6card"><h3>🧩 Our Love Puzzle</h3><p class="v6lead">Tap two tiles to swap them and reveal our heart. / இரண்டு கட்டங்களை மாற்றுங்கள்.</p><div id="v6puzzleBoard" class="v6grid" style="grid-template-columns:repeat(3,1fr);gap:4px"></div><p id="v6puzzleScore">Moves: ${v6moves}</p>${v6btn('🔀 New Puzzle','v6NewPuzzle()')}<p class="v6tiny">Best: ${data.puzzleBest??'—'} moves</p></div>`;break;
case 'treasure':{let qs=[['Where is our favourite place?','Together','Apart'],['What is the sweetest gift?','Time together','An expensive present'],['What makes a relationship stronger?','Kindness','Guessing feelings']];let q=qs[v6treasure%qs.length];inner=`<div class="v6card" style="text-align:center"><span class="v6big">${v6reveal?'💎':'🔐'}</span><h3>Secret Treasure</h3>${v6reveal?`<p>My favourite treasure is YOU. 💖<br>என் அழகான பொக்கிஷம் நீதான்!</p>${v6btn('🔁 Play again','v6TreasureReset()')}`:`<p class="v6lead">Unlock a surprise with 3 sweet questions.</p><p>Question ${v6treasure+1}/3</p><h3>${safe(q[0])}</h3><div class="v6options">${q.slice(1).map((t,i)=>`<button class="btn secondary" onclick="v6TreasurePick(${i})">${safe(t)}</button>`).join('')}</div>`}</div>`;break;}
case 'future':inner=`<div class="v6card"><h3>💌 Future Love Letters</h3><p class="v6lead">A letter for a future day. / நாளைய நாளுக்கான காதல் கடிதம்.</p><label>Unlock date</label><input class="field" id="futureDate" type="date" min="${v6today()}"><label>My secret letter</label><textarea class="field" id="futureText" rows="5" maxlength="1500" placeholder="My love, when you read this..."></textarea>${v6btn('💗 Seal this letter','v6SealLetter()')}<h3>Our sealed letters</h3>${data.futureLetters.slice().reverse().map((x,i)=>{let open=v6today()>=x.date;return `<div class="item"><b>${open?'💌 Open letter':'🔒 Sealed until '+safe(x.date)}</b><p>${open?safe(x.text):'A surprise is waiting for you...'}</p></div>`}).join('')||'<p class="v6lead">No sealed letters yet.</p>'}</div>`;break;
case 'need':inner=`<div class="v6card" style="text-align:center"><span class="v6big">🥺</span><h3>I Need You</h3><p>சில நேரங்களில் ஒரு அன்பான வார்த்தை போதும்.</p><p class="v6lead">Choose what you need. There is no pressure to reply immediately.</p>${[['hug','🫂 I need a hug'],['talk','💬 Can we talk?'],['comfort','💜 I need some comfort']].map(([id,t])=>v6btn(t,`v6Need('${id}')`)).join('')}<h3>Saved requests</h3>${data.needHistory.slice(-4).reverse().map(x=>`<div class="item">${safe(x.message)} <small>${safe(x.date)}</small></div>`).join('')}</div>`;break;
case 'gifts':inner=`<div class="v6card"><h3>🎁 Virtual Gifts</h3><p class="v6lead">Small surprises, infinite love.</p><div class="v6grid">${[['🌹','Rose'],['🍫','Chocolate'],['🧸','Teddy'],['💍','Promise'],['💐','Flowers'],['💋','Kiss']].map(([e,n])=>`<button class="v6tile" onclick="v6Gift('${e}','${n}')"><strong>${e}</strong>Send ${n}</button>`).join('')}</div><h3>Our gift collection (${data.gifts.length})</h3>${data.gifts.slice(-8).reverse().map(x=>`<div class="item">${safe(x.emoji)} ${safe(x.name)} <span class="v6tiny">${safe(x.date)}</span></div>`).join('')||'<p class="v6lead">Your first gift is waiting.</p>'}</div>`;break;
case 'photo':{let todays=data.dailyPhotos.filter(x=>x.date===v6today());inner=`<div class="v6card"><h3>📸 One Photo a Day</h3><p class="v6lead">One moment from today. / இன்றைய ஒரு அழகான நினைவு.</p><label>Choose your photo</label><input class="field" type="file" id="dailyPhoto" accept="image/*"><label>A little caption</label><input class="field" id="dailyCaption" maxlength="100" placeholder="Wish you were here..."><button class="btn v6btn" onclick="v6SavePhoto()">💗 Save Today's Photo</button><p class="v6tiny">Photos are stored only on this device. Large photos may fill browser storage.</p>${todays.map(x=>`<div class="item"><img class="v6photo" src="${x.image}" alt="Daily memory"><p>${safe(x.caption)}</p></div>`).join('')||'<p class="v6lead">No photo for today yet.</p>'}<h3>Previous days</h3>${data.dailyPhotos.filter(x=>x.date!==v6today()).slice(-5).reverse().map(x=>`<div class="item"><b>${safe(x.date)}</b><img class="v6photo" src="${x.image}" alt="Memory"><p>${safe(x.caption)}</p></div>`).join('')}</div>`;break;}}
return v6back()+inner+v6back()}
function v6Heartbeat(){data.heartbeats++;save();navigator.vibrate?.([90,80,160,80,250]);render();notify('A heartbeat saved with love 💓')}
function v6AddMoon(){let t=$('#moonWish').value.trim();if(!t)return notify('Write your wish first 🌙');data.moonNotes.push({text:t,date:v6today()});save();render()}
function v6Ritual(k){let t=v6today();data.rituals[t]??={};data.rituals[t][k]=!data.rituals[t][k];save();render()}
function v6Spin(){v6roulette=(v6roulette+1+Math.floor(Math.random()*7))%8;render();navigator.vibrate?.(70)}
function v6ShareRoulette(){shareText(['💋 Send a flying kiss','💌 Write a three-line love poem','🥰 Tell your favourite memory','🎤 Send a sweet voice note','🫂 Give a virtual hug','🌹 Say three things you love','💃 Do a tiny happy dance','💕 Plan a dream date'][v6roulette])}
function v6NewPuzzle(){v6puzzle=Array.from({length:9},(_,i)=>i);for(let i=8;i>0;i--){let j=Math.floor(Math.random()*(i+1));[v6puzzle[i],v6puzzle[j]]=[v6puzzle[j],v6puzzle[i]]}v6moves=0;v6DrawPuzzle()}
let v6selected=null;function v6DrawPuzzle(){let el=$('#v6puzzleBoard');if(!el)return;el.innerHTML=v6puzzle.map((n,i)=>`<button aria-label="Puzzle tile ${i+1}" onclick="v6Tile(${i})" style="aspect-ratio:1;border:3px solid ${v6selected===i?'#b45ab6':'#fff'};border-radius:10px;background:linear-gradient(135deg,#ed6ca8,#9857c9);color:#fff;font-size:24px;font-weight:bold">${['💗','💜','💕','🌸','N','❤️','T','💖','✨'][n]}</button>`).join('');$('#v6puzzleScore').textContent='Moves: '+v6moves}
function v6Tile(i){if(v6selected===null){v6selected=i;v6DrawPuzzle();return}if(i!==v6selected){[v6puzzle[i],v6puzzle[v6selected]]=[v6puzzle[v6selected],v6puzzle[i]];v6moves++}v6selected=null;v6DrawPuzzle();if(v6puzzle.every((x,j)=>x===j)){if(data.puzzleBest===null||v6moves<data.puzzleBest)data.puzzleBest=v6moves;save();notify('Puzzle complete! Our hearts fit together 💞')}}
function v6TreasurePick(i){if(i!==0){notify('Try another answer 💕');return}v6treasure++;if(v6treasure>=3){v6reveal=true;data.treasureWins++;save()}render()}
function v6TreasureReset(){v6treasure=0;v6reveal=false;render()}
function v6SealLetter(){let date=$('#futureDate').value,text=$('#futureText').value.trim();if(!date||!text||date<=v6today())return notify('Choose a future date and write a letter 💌');data.futureLetters.push({date,text});save();render();notify('Letter sealed with love 🔒')}
function v6Need(id){let t={hug:'🫂 I need a hug',talk:'💬 Can we talk?',comfort:'💜 I need some comfort'}[id];data.needHistory.push({message:t,date:new Date().toLocaleString()});save();shareText(t+' — Thinking of you ❤️');render()}
function v6Gift(emoji,name){data.gifts.push({emoji,name,date:v6today()});save();render();notify(name+' added to our collection 💝')}
function v6SavePhoto(){let file=$('#dailyPhoto').files[0],caption=$('#dailyCaption').value.trim();if(!file)return notify('Choose a photo first 📸');if(!file.type.startsWith('image/'))return notify('Only images are supported');let reader=new FileReader();reader.onload=()=>{let im=new Image();im.onload=()=>{let c=document.createElement('canvas'),scale=Math.min(1,850/Math.max(im.width,im.height));c.width=Math.max(1,Math.round(im.width*scale));c.height=Math.max(1,Math.round(im.height*scale));c.getContext('2d').drawImage(im,0,0,c.width,c.height);let image=c.toDataURL('image/jpeg',.65);let old=data.dailyPhotos.slice();data.dailyPhotos=data.dailyPhotos.filter(x=>x.date!==v6today());data.dailyPhotos.push({date:v6today(),image,caption});try{save();render();notify('Today’s memory saved 💗')}catch(e){data.dailyPhotos=old;notify('Phone storage is full — try a smaller photo')}};im.src=reader.result};reader.readAsDataURL(file)}
const v5render=render;
render=function(){if(page==='Love+'){$('#heading').textContent='நம் காதல் உலகம் · Love+';$('#screen').innerHTML=v6page();$('#nav').innerHTML=tabs.map((t,i)=>`<button class="${page===t?'active':''}" onclick="go('${t}')"><b>${icons[i]}</b>${tamilTabs[i]}</button>`).join('')+`<button class="active" onclick="v6Go('menu')"><b>💗</b>Love+</button>`;if(v6mode==='puzzle'){if(!v6puzzle.length)v6NewPuzzle();else v6DrawPuzzle()}return}v5render();$('#nav').insertAdjacentHTML('beforeend',`<button onclick="v6Go('menu')"><b>💗</b>Love+</button>`);if(page==='Home')$('#screen').insertAdjacentHTML('beforeend',`<div class="v6card" style="text-align:center"><h3>💗 Our Love Universe · v6.0</h3><p class="v6lead">10 new ways to feel close, even when miles apart.</p>${btn('✨ Explore Romantic Features',"v6Go('menu')")}</div>`)};
render();
</script><div style="position:fixed;bottom:85px;right:12px;z-index:9999"><a href="connection.html" style="display:block;background:linear-gradient(120deg,#f26eaa,#9659d2);color:white;padding:13px 17px;border-radius:99px;box-shadow:0 5px 22px #99549b88;text-decoration:none;font:700 14px system-ui">💓 Live Connection</a></div></body></html>
